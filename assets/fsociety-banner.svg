<!-- VHS tears across imagery -->
<g opacity=".76">
<rect x="776" y="145" width="410" height="3" fill="#140b0d"/><rect x="801" y="147" width="110" height="2" fill="#ef3043"/>
<rect x="914" y="213" width="269" height="2" fill="#ece8e5" opacity=".46"/>
<rect x="771" y="271" width="167" height="3" fill="#ca1933"/>
<rect x="1020" y="272" width="160" height="2" fill="#1b0b0d"/>
<rect x="866" y="336" width="240" height="2" fill="#9d1a2d"/>
</g>
<g font-family="'Courier New',monospace" font-size="11" fill="#b82b3e" opacity=".76">
<text x="1090" y="53">5/9</text><text x="1090" y="70">fsociety</text><text x="1090" y="89">0x00</text>
</g>
<rect width="1200" height="385" fill="url(#lines)" pointer-events="none"/>
</g>
<rect x="1.5" y="1.5" width="1197" height="382" rx="9" fill="none" stroke="#69515a" stroke-width="2"/>
