<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="385" viewBox="0 0 1200 385" role="img" aria-labelledby="t d">
<title id="t">Hello, friend — Miguel Ávila, fsociety-inspired GitHub banner</title>
<desc id="d">Arte original inspirada na identidade visual de fsociety de Mr. Robot, com figura de cartola, máscara de bigode branco, estática VHS e terminal vermelho e preto.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090c"/><stop offset=".53" stop-color="#0f0a10"/><stop offset="1" stop-color="#030406"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#a00820" stop-opacity=".56"/><stop offset=".48" stop-color="#670b1a" stop-opacity=".21"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<linearGradient id="face" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#f8e6d8"/><stop offset=".58" stop-color="#ddc1b1"/><stop offset="1" stop-color="#a47a71"/></linearGradient>
<linearGradient id="hat" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#111015"/><stop offset=".45" stop-color="#29252a"/><stop offset="1" stop-color="#050507"/></linearGradient>
<pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect y="3" width="4" height=".7" fill="#fff" opacity=".05"/></pattern>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3b1821" stroke-width=".7" opacity=".37"/></pattern>
<clipPath id="frame"><rect x="1" y="1" width="1198" height="383" rx="9"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="385" fill="url(#bg)"/>
<rect width="1200" height="385" fill="url(#grid)"/>
<circle cx="1000" cy="184" r="288" fill="url(#halo)"/>
<g opacity=".3" fill="#e5273b"><rect x="0" y="82" width="640" height="2"/><rect x="370" y="98" width="165" height="2"/><rect x="108" y="236" width="568" height="1"/><rect x="44" y="251" width="212" height="3"/><rect x="584" y="155" width="250" height="1"/><rect x="46" y="347" width="720" height="2"/></g>
<g opacity=".21" fill="#eee"><rect x="690" y="48" width="113" height="2"/><rect x="698" y="53" width="71" height="1"/><rect x="560" y="296" width="208" height="2"/><rect x="725" y="311" width="145" height="2"/><rect x="49" y="319" width="340" height="1"/></g>
<path d="M785 0V385" stroke="#7c1c2b" stroke-width="1" stroke-dasharray="3 7" opacity=".5"/>
<g font-family="'Courier New',monospace" font-size="14" letter-spacing="1.4">
<text x="44" y="36" fill="#c7bdbe" opacity=".8">miguellavila@terminal:~$  ./identity --init</text>
<text x="44" y="67" fill="#df344a">[ SYSTEM ONLINE ]</text>
<text x="44" y="95" fill="#8c747b" font-size="12">SESSION: fsociety / 05.09  |  ACCESS: LEARNING</text>
</g>
<g font-family="Arial Black,Impact,'Arial',sans-serif" font-weight="900" letter-spacing="-4">
<text x="41" y="197" font-size="78" fill="#ba162d" opacity=".55">HELLO, FRIEND.</text>
<text x="46" y="192" font-size="78" fill="#f4f0ee">HELLO, FRIEND.</text>
</g>
<rect x="48" y="209" width="665" height="3" fill="#b51d32"/>
<g font-family="'Courier New',monospace">
<text x="49" y="247" font-size="22" font-weight="bold" letter-spacing="4" fill="#f3eaeb">MIGUEL ÁVILA</text>
<text x="50" y="276" font-size="13" letter-spacing="2.1" fill="#e54f5f">CYBERSECURITY  //  SOFTWARE  //  PENTEST</text>
<text x="49" y="321" font-size="15" fill="#beb0b3">&gt; question systems. understand code. build better.</text>
</g>
<rect x="48" y="340" width="665" height="1" fill="#51434b"/>
<g font-family="'Courier New',monospace" font-size="10" fill="#887a7e" letter-spacing="1.2"><text x="49" y="362">/usr/bin/whoami</text><text x="475" y="362">NOT A MANIFESTO. JUST A MINDSET.</text></g>
